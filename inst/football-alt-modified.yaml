meta:
  type: alternative
  block: block-logistic-model
alternatives:
  - tag: block-bayesian-logistic-model
    action: "estimate the effect size of skin tone on red card"
    decision: "Fit a Bayesian logistic regression model, incorporating prior distributions for parameters,
with red card as the dependent variable and average skin tone rating and other covariates as predictors."
    justification: "Bayesian methods provide a full posterior distribution for the effect sizes, allowing
for direct probabilistic statements about the parameters. They can also incorporate prior domain knowledge
and are robust in situations with complex models or smaller sample sizes, offering a different
philosophical and practical approach to parameter estimation."
  - tag: block-gam-logistic-model
    action: "estimate the effect size of skin tone on red card"
    decision: "Fit a Generalized Additive Model (GAM) with a logistic link function, allowing for
non-linear relationships between average skin tone rating and other continuous covariates and the log-odds
of a red card."
    justification: "GAMs allow for flexible, non-parametric modeling of the relationship between predictors
(e.g., skin tone) and the log-odds of the outcome (red card) through smoothing functions. This approach is
less restrictive than assuming a strictly linear relationship, potentially capturing more nuanced effects
and improving model fit without sacrificing interpretability."
  - tag: block-random-effect
    action: "estimate the effect size of skin tone on red card"
    decision: "Fit a random effect model with a logistic link with only referee number as the random effect"
    justification: "Given the number of referee, it is better treated as a random effect if included in the model"
  - tag: block-random-effect-2
    action: "estimate the effect size of skin tone on red card"
    decision: "Fit a random effect model with a logistic link with referee number and player ID as the random effect"
    justification: "Given the number of referees and players, they are better treated as random effects if included in the model"
