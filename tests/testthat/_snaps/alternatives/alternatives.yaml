meta:
  type: alternatives
  step: step-logistic-model
alternatives:
- id: step-mixed-effects-logistic-model
  fork: estimate the effect size of skin tone on red card
  path: fit a generalized linear mixed-effects model (GLMM) with random intercepts
    for players and referees to account for hierarchical data structure
  rationale: mixed-effects models are appropriate for clustered data as they control
    for non-independence of observations within players and referees, leading to more
    reliable standard errors and effect estimates
- id: step-probit-regression-model
  fork: estimate the effect size of skin tone on red card
  path: fit a probit regression model using the average skin tone rating and specified
    covariates
  rationale: probit models provide a methodologically valid alternative to logistic
    regression by assuming a normally distributed latent variable, serving as a sensitivity
    check for the choice of link function
- id: step-bayesian-logistic-model
  fork: estimate the effect size of skin tone on red card
  path: fit a Bayesian logistic regression model with the average skin tone rating
    as a predictor and weakly informative priors
  rationale: the Bayesian approach provides a complete posterior distribution of the
    effect size rather than a point estimate, allowing for a more nuanced probabilistic
    interpretation of the skin tone effect and its uncertainty
